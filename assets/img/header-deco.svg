<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <radialGradient id="glow" cx="72%" cy="40%" r="60%">
      <stop offset="0" stop-color="#3d86bd" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3d86bd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#9cc3e0" opacity=".35"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="900" height="360" fill="url(#fade)"/></mask>
  </defs>
  <rect width="900" height="360" fill="url(#glow)"/>
  <rect width="900" height="360" fill="url(#dots)" mask="url(#m)"/>
  <g fill="none" stroke-linecap="round" mask="url(#m)">
    <!-- blue loop, after the logo's outer stroke -->
    <path d="M560 400 C 520 250, 560 80, 680 40 C 790 5, 880 90, 850 210 C 825 310, 720 330, 690 250" stroke="#9cc3e0" stroke-width="16" opacity=".55"/>
    <!-- green loop, after the logo's inner stroke -->
    <path d="M610 420 C 600 300, 630 170, 720 140 C 800 115, 850 190, 815 260 C 790 310, 735 300, 725 250" stroke="#a7bd3a" stroke-width="12" opacity=".8"/>
    <!-- faint echo lines -->
    <path d="M470 380 C 450 220, 520 40, 700 -10" stroke="#ffffff" stroke-width="2" opacity=".18"/>
    <path d="M500 390 C 490 240, 560 70, 760 10" stroke="#ffffff" stroke-width="2" opacity=".12"/>
  </g>
</svg>
